name: Editor React consumer compatibility
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    name: Consumer / React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
          architecture: x64
      - name: Validate and build library
        shell: bash
        run: |
          npm run check:runtime -- --expected-major 24
          npm ci --engine-strict --strict-peer-deps --force=false --legacy-peer-deps=false --include=dev --include=optional
          npm run test:consumer:contract
          npm run test:toolbar
          npm run check:toolbar
          npm run build
          git diff --exit-code HEAD -- package.json package-lock.json
      - name: Isolated packed consumer
        shell: bash
        env:
          REACT_LANE: ${{ matrix.react }}
          CONSUMER_REPORT_DIR: ${{ runner.temp }}/consumer-evidence
        run: |
          npm run test:consumer -- "$REACT_LANE"
          git diff --exit-code HEAD -- package.json package-lock.json
      - name: Record early failure if runner evidence is absent
        if: failure()
        shell: bash
        env:
          REACT_LANE: ${{ matrix.react }}
          CONSUMER_REPORT_DIR: ${{ runner.temp }}/consumer-evidence
        run: |
          mkdir -p "$CONSUMER_REPORT_DIR"
          if [ ! -f "$CONSUMER_REPORT_DIR/run-status.json" ]; then
            node -e 'const fs=require("node:fs");const p=process.env;fs.writeFileSync(p.CONSUMER_REPORT_DIR+"/run-status.json",JSON.stringify({schema:1,status:"failed",lane:p.REACT_LANE,commit:p.GITHUB_SHA,runId:p.GITHUB_RUN_ID,runAttempt:p.GITHUB_RUN_ATTEMPT,stage:"workflow-preflight-or-interrupted",error:"No runner status; inspect failed workflow step logs"},null,2)+"\n",{flag:"wx"})'
          fi
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: react-${{ matrix.react }}-consumer-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-evidence/
          if-no-files-found: error
          retention-days: 14
  required-gate:
    name: Required React consumer compatibility gate
    if: always()
    needs: [consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          CONSUMER_RESULT: ${{ needs.consumer.result }}
        run: |
          test "$CONSUMER_RESULT" = success
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
          architecture: x64
      - name: Download React 18 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-18-consumer-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/react18-evidence
          digest-mismatch: error
      - name: Download React 19 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: react-19-consumer-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/react19-evidence
          digest-mismatch: error
      - name: Verify paired consumer evidence
        shell: bash
        run: |
          node tools/formatting-closure.cjs "$GITHUB_SHA" "$RUNNER_TEMP/react18-evidence" "$RUNNER_TEMP/react19-evidence" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee "$RUNNER_TEMP/react-pair.json"
      - name: Upload verified pair summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: react-pair-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/react-pair.json
          if-no-files-found: error
          retention-days: 14
