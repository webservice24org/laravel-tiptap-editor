name: Editor React consumer compatibility
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    name: Consumer / React ${{ matrix.react }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
          architecture: x64
      - name: Validate and build library
        shell: bash
        run: |
          npm run check:runtime -- --expected-major 24
          npm ci --engine-strict --strict-peer-deps --force=false --legacy-peer-deps=false --include=dev --include=optional
          npm run test:consumer:contract
          npm run build
          git diff --exit-code HEAD -- package.json package-lock.json
      - name: Isolated packed consumer
        shell: bash
        env:
          REACT_LANE: ${{ matrix.react }}
          CONSUMER_REPORT_DIR: ${{ runner.temp }}/consumer-evidence
        run: |
          npm run test:consumer -- "$REACT_LANE"
          git diff --exit-code HEAD -- package.json package-lock.json
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: react-${{ matrix.react }}-consumer-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-evidence/
          if-no-files-found: error
          retention-days: 14
  required-gate:
    name: Required React consumer compatibility gate
    if: always()
    needs: [consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          CONSUMER_RESULT: ${{ needs.consumer.result }}
        run: |
          test "$CONSUMER_RESULT" = success
          echo 'Both packed React consumer environments passed.'
